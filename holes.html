  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function loadGraph(G) {
    const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));
    const c = G.counts || {};
    document.getElementById("summary").textContent =
      `${G.nodes.length} modules · ${G.sorryCount} sorry · ${c.open||0} open · ${c.blocked||0} blocked · ${c.done||0} done · updated ${G.updated}`;
    document.getElementById("notes").innerHTML = (G.notes||[]).map(n => `<li>${esc(n)}</li>`).join("");

    // Layering: longest path from sources over all hard edges.
    const preds = {}; G.nodes.forEach(n => preds[n.id] = []);
    G.edges.forEach(e => preds[e.to].push(e.from));
    const layer = {};
    const depth = id => layer[id] ?? (layer[id] = preds[id].length ? 1 + Math.max(...preds[id].map(depth)) : 0);
    G.nodes.forEach(n => depth(n.id));
    const cols = {};
    G.nodes.forEach(n => (cols[layer[n.id]] ||= []).push(n));
    const order = ["Basic","Sobolev","Bessel","Smooth","Occupation","Main","Appendix"];
    Object.values(cols).forEach(col => col.sort((a,b) =>
      (order.indexOf(a.section) - order.indexOf(b.section)) || a.id.localeCompare(b.id)));
    const W = 190, H = 40, GX = 70, GY = 14, PAD = 20;
    const pos = {};
    let maxRows = 0;
    Object.entries(cols).forEach(([L, col]) => {
      col.forEach((n, i) => pos[n.id] = { x: PAD + L * (W + GX), y: PAD + i * (H + GY) });
      maxRows = Math.max(maxRows, col.length);
    });
    const nL = Object.keys(cols).length;
    const svg = document.getElementById("graph");
    svg.setAttribute("width", PAD * 2 + nL * (W + GX));
    svg.setAttribute("height", PAD * 2 + maxRows * (H + GY));
    const draw = G.drawEdges || G.edges;
    let out = "";
    draw.forEach(e => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      out += `<path class="edge" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    });
    G.nodes.forEach(n => {
      const p = pos[n.id];
      const sub = (n.paper ? n.paper + " · " : "") + (n.sorryCount ? n.sorryCount + " sorry" : "no sorry");
      out += `<g class="node${n.paperGoal ? " goal" : ""}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
        <title>${esc(n.id)}\n${esc(n.detail)}</title>
        <rect width="${W}" height="${H}" fill="${COLORS[n.status]}"></rect>
        <text x="8" y="16">${esc(n.label)}</text>
        <text class="sub" x="8" y="31">${esc(sub.slice(0, 40))}</text></g>`;
    });
    svg.innerHTML = out;

    function select(id) {
      svg.querySelectorAll(".node").forEach(g => g.classList.toggle("sel", g.dataset.id === id));
      svg.querySelectorAll(".edge").forEach(p => p.classList.toggle("hl", p.dataset.from === id || p.dataset.to === id));
      const n = byId[id];
      const users = G.edges.filter(e => e.from === id).map(e => e.to);
      document.getElementById("detail").innerHTML = `
        <h2>${esc(n.id)} <span class="pill" style="background:${COLORS[n.status]}">${n.status}</span></h2>
        <p><b>Paper:</b> ${esc(n.paper || "—")}<br><b>File:</b> <code>${esc(n.file)}</code><br>
        <b>Section:</b> ${esc(n.sectionTitle)}<br><b>Declarations:</b> ${esc(JSON.stringify(n.declKinds))}</p>
        <p>${esc(n.detail)}</p>
        <p><b>Holes:</b> ${n.holes.length ? n.holes.map(h => `<code>${esc(h)}</code>`).join(" ") : "none"}</p>
        <p><b>Imports:</b> ${n.deps.map(d => `<a href="#" data-go="${esc(d)}">${esc(d)}</a>`).join(", ") || "—"}</p>
        <p><b>Blocked by:</b> ${n.blockers.map(d => `<a href="#" data-go="${esc(d)}">${esc(d)}</a>`).join(", ") || "—"}</p>
        <p><b>Used by:</b> ${users.map(d => `<a href="#" data-go="${esc(d)}">${esc(d)}</a>`).join(", ") || "—"}</p>`;
    }
    svg.addEventListener("click", ev => { const g = ev.target.closest(".node"); if (g) select(g.dataset.id); });
    document.getElementById("side").addEventListener("click", ev => {
      const a = ev.target.closest("[data-go]"); if (!a) return; ev.preventDefault(); select(a.dataset.go);
      const p = pos[a.dataset.go]; document.getElementById("graphwrap").scrollTo({ left: p.x - 100, top: p.y - 100, behavior: "smooth" });
    });
    const opens = G.nodes.filter(n => n.status === "open");
    document.getElementById("openlist").innerHTML = opens.length ? "<table>" + opens.map(n =>
      `<tr><td><a href="#" data-go="${esc(n.id)}">${esc(n.id)}</a></td><td>${esc(n.paper||"")}</td><td>${n.sorryCount}</td></tr>`).join("") + "</table>" : "<p>None.</p>";
    document.getElementById("filter").addEventListener("input", ev => {
      const q = ev.target.value.toLowerCase();
      svg.querySelectorAll(".node").forEach(g => g.style.opacity = (!q || g.dataset.id.toLowerCase().includes(q) || (byId[g.dataset.id].paper||"").toLowerCase().includes(q)) ? 1 : .15);
    });
  }

  if (EMBEDDED_HOLES_GRAPH && typeof EMBEDDED_HOLES_GRAPH === "object") {
    loadGraph(EMBEDDED_HOLES_GRAPH);
  } else {
    fetch("holes-graph.json", { cache: "no-store" }).then(r => r.json()).then(loadGraph)
      .catch(err => { document.getElementById("detail").textContent = `Could not load holes-graph.json (${err.message}).`; });
  }
</script>
