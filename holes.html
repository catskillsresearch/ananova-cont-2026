  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  const VIEW = { hideDone: true, hideSub: false };
  let FULL = null;

  function view(G0) {
    const keep = n => !(VIEW.hideDone && n.status === "done") && !(VIEW.hideSub && n.kind === "subgoal");
    const nodes = G0.nodes.filter(keep);
    const ids = new Set(nodes.map(n => n.id));
    const ok = e => ids.has(e.from) && ids.has(e.to);
    return { ...G0, nodes, edges: G0.edges.filter(ok), drawEdges: (G0.drawEdges || G0.edges).filter(ok) };
  }

  function loadGraph(G0) {
    FULL = G0;
    const G = view(G0);
    const byId = Object.fromEntries(G0.nodes.map(n => [n.id, n]));
    const c = G0.counts || {}, gc = G0.goalCounts || {}, sc = G0.subgoalCounts || {};
    const nGoal = G0.nodes.filter(n => n.kind !== "subgoal").length, nSub = G0.nodes.length - nGoal;
    document.getElementById("summary").textContent =
      `${nGoal} goals (${gc.open||0} open · ${gc.blocked||0} blocked · ${gc.done||0} done) · ` +
      `${nSub} subgoals (${sc.open||0} open · ${sc.blocked||0} blocked · ${sc.done||0} done) · ` +
      `${G0.sorryCount} sorry · showing ${G.nodes.length} · updated ${G0.updated}`;
    document.getElementById("notes").innerHTML = (G0.notes||[]).map(n => `<li>${esc(n)}</li>`).join("") +
      ((G0.untagged||[]).length ? `<li><b>Untagged subgoals:</b> ${G0.untagged.map(esc).join(", ")}</li>` : "");

    const preds = {}; G.nodes.forEach(n => preds[n.id] = []);
    G.edges.forEach(e => preds[e.to].push(e.from));
    const layer = {};
    const depth = id => layer[id] ?? (layer[id] = preds[id].length ? 1 + Math.max(...preds[id].map(depth)) : 0);
    G.nodes.forEach(n => depth(n.id));
    const cols = {};
    G.nodes.forEach(n => (cols[layer[n.id]] ||= []).push(n));
    const order = ["Basic","Sobolev","Bessel","Smooth","Occupation","Main","Appendix"];
    Object.values(cols).forEach(col => col.sort((a,b) =>
      (order.indexOf(a.section) - order.indexOf(b.section)) || a.id.localeCompare(b.id)));
    const W = 190, H = 40, GX = 70, GY = 14, PAD = 20;
    const pos = {};
    let maxRows = 0;
    const layers = Object.keys(cols).map(Number).sort((a,b) => a-b);
    layers.forEach((L, li) => {
      cols[L].forEach((n, i) => pos[n.id] = { x: PAD + li * (W + GX), y: PAD + i * (H + GY) });
      maxRows = Math.max(maxRows, cols[L].length);
    });
    const svg = document.getElementById("graph");
    svg.setAttribute("width", PAD * 2 + Math.max(1, layers.length) * (W + GX));
    svg.setAttribute("height", PAD * 2 + Math.max(1, maxRows) * (H + GY));
    let out = "";
    G.drawEdges.forEach(e => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      out += `<path class="edge" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    });
    G.nodes.forEach(n => {
      const p = pos[n.id];
      const sub = (n.paper ? n.paper + " · " : "") + (n.sorryCount ? n.sorryCount + " sorry" : "no sorry");
      const cls = "node" + (n.paperGoal ? " goal" : "") + (n.kind === "subgoal" ? " subgoal" : "");
      out += `<g class="${cls}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
        <title>${esc(n.id)}\n${esc(n.detail)}</title>
        <rect width="${W}" height="${H}" fill="${COLORS[n.status]}"></rect>
        <text x="8" y="16">${esc((n.kind === "subgoal" ? "↳ " : "") + n.label).slice(0, 30)}</text>
        <text class="sub" x="8" y="31">${esc(sub.slice(0, 40))}</text></g>`;
    });
    svg.innerHTML = out;

    function select(id) {
      svg.querySelectorAll(".node").forEach(g => g.classList.toggle("sel", g.dataset.id === id));
      svg.querySelectorAll(".edge").forEach(p => p.classList.toggle("hl", p.dataset.from === id || p.dataset.to === id));
      const n = byId[id]; if (!n) return;
      const users = G0.edges.filter(e => e.from === id).map(e => e.to);
      const subs = G0.nodes.filter(m => m.parentGoal === id).map(m => m.id);
      document.getElementById("detail").innerHTML = `
        <h2>${esc(n.id)} <span class="pill" style="background:${COLORS[n.status]}">${n.status}</span></h2>
        <p><b>${n.kind === "subgoal" ? "Subgoal" : "Goal"}:</b> ${esc(n.paper || "—")}<br><b>File:</b> <code>${esc(n.file)}</code><br>
        <b>Section:</b> ${esc(n.sectionTitle)}<br><b>Declarations:</b> ${esc(JSON.stringify(n.declKinds))}</p>
        ${n.doc ? `<p><i>${esc(n.doc)}</i></p>` : ""}
        <p>${esc(n.detail)}</p>
        <p><b>Holes:</b> ${n.holes.length ? n.holes.map(h => `<code>${esc(h)}</code>`).join(" ") : "none"}</p>
        ${n.parentGoal ? `<p><b>Parent goal:</b> <a href="#" data-go="${esc(n.parentGoal)}">${esc(n.parentGoal)}</a></p>` : ""}
        ${subs.length ? `<p><b>Subgoals:</b> ${subs.map(d => `<a href="#" data-go="${esc(d)}">${esc(d.split("::")[1])}</a>`).join(", ")}</p>` : ""}
        <p><b>Depends on:</b> ${n.deps.map(d => `<a href="#" data-go="${esc(d)}">${esc(d)}</a>`).join(", ") || "—"}</p>
        <p><b>Blocked by:</b> ${n.blockers.map(d => `<a href="#" data-go="${esc(d)}">${esc(d)}</a>`).join(", ") || "—"}</p>
        <p><b>Used by:</b> ${users.map(d => `<a href="#" data-go="${esc(d)}">${esc(d)}</a>`).join(", ") || "—"}</p>`;
    }
    svg.onclick = ev => { const g = ev.target.closest(".node"); if (g) select(g.dataset.id); };
    document.getElementById("side").onclick = ev => {
      const a = ev.target.closest("[data-go]"); if (!a) return; ev.preventDefault(); select(a.dataset.go);
      const p = pos[a.dataset.go]; if (p) document.getElementById("graphwrap").scrollTo({ left: p.x - 100, top: p.y - 100, behavior: "smooth" });
    };
    const opens = G.nodes.filter(n => n.status === "open");
    document.getElementById("openlist").innerHTML = opens.length ? "<table>" + opens.map(n =>
      `<tr><td><a href="#" data-go="${esc(n.id)}">${esc(n.id)}</a></td><td>${esc(n.paper||"")}</td><td>${n.sorryCount}</td></tr>`).join("") + "</table>" : "<p>None.</p>";
    const filt = document.getElementById("filter");
    filt.oninput = () => {
      const q = filt.value.toLowerCase();
      svg.querySelectorAll(".node").forEach(g => g.style.opacity = (!q || g.dataset.id.toLowerCase().includes(q) || (byId[g.dataset.id].paper||"").toLowerCase().includes(q)) ? 1 : .15);
    };
    filt.oninput();
  }

  const bDone = document.getElementById("toggleDone"), bSub = document.getElementById("toggleSub");
  bDone.onclick = () => { VIEW.hideDone = !VIEW.hideDone; bDone.textContent = VIEW.hideDone ? "Show done" : "Hide done"; bDone.classList.toggle("on", VIEW.hideDone); if (FULL) loadGraph(FULL); };
  bSub.onclick = () => { VIEW.hideSub = !VIEW.hideSub; bSub.textContent = VIEW.hideSub ? "Show subgoals" : "Hide subgoals"; bSub.classList.toggle("on", VIEW.hideSub); if (FULL) loadGraph(FULL); };

  if (EMBEDDED_HOLES_GRAPH && typeof EMBEDDED_HOLES_GRAPH === "object") {
    loadGraph(EMBEDDED_HOLES_GRAPH);
  } else {
    fetch("holes-graph.json", { cache: "no-store" }).then(r => r.json()).then(loadGraph)
      .catch(err => { document.getElementById("detail").textContent = `Could not load holes-graph.json (${err.message}).`; });
  }
</script>
</body>
