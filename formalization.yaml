# ananova-cont-2026 — Palomar packaging (Challenge/Solution/comparator).
version: v0.4
project:
  name: WeakPathwiseIto — A pathwise Ito formula for weakly differentiable functions in Lean 4
  description: >-
    A Lean 4 / Mathlib formalization (blueprint stage) of Anna Ananova and Rama Cont,
    "A pathwise Ito formula for weakly differentiable functions", arXiv:2608.07365v2.
    Paths of finite quadratic variation along a sequence of partitions, discrete weighted
    occupation densities, the path-dependent Sobolev space W^2_{ω,π} (Definition 4.3), the
    weak pathwise integral and covariation, the change-of-variable formula (Theorem 5.1),
    Sobolev traces along Brownian paths outside a polar set (Theorem 5.2), and the pathwise
    Föllmer–Protter formula (Proposition 5.3).
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
